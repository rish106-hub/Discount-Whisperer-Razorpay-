name = "dw-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[[kv_namespaces]]
binding = "LADDERS"
id = "dcad32f1e95249bab9effe87a89cb84e"

# Demo store served from the same Worker; API paths always reach the Worker first.
[assets]
directory = "../demo/public"
run_worker_first = ["/healthz", "/v1/*", "/internal/*"]

[triggers]
crons = ["*/5 * * * *"]

# Secrets (SUPABASE_*, RAZORPAY_*, ADMIN_TOKEN, REBUILD_HOOK_SECRET): .dev.vars locally, `wrangler secret put` in T7.
